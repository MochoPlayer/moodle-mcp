[project]
name = "moodle-mcp"
version = "0.1.0"
description = "MCP server for UPM Moodle: browser login with automatic token catch, courses, downloads, assignments"
readme = "README.md"
authors = [
    { name = "Mario Castro", email = "macasmu04@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "keyring>=25.7.0",
    "mcp>=2.3.0",
    "pyyaml>=6.0.3",
    "websocket-client>=1.9.2",
]

[project.scripts]
moodle-mcp = "moodle_mcp.server:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
